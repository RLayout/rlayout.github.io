name: Publish RLayout

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA in RLayout/rlayout to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Validate source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
          AUTOMATIC: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA']):
              raise SystemExit('source_sha must be a full lowercase Git commit SHA')
          PY
          resolved_sha=$(gh api "repos/RLayout/rlayout/commits/$SOURCE_SHA" --jq .sha)
          if [[ "$resolved_sha" != "$SOURCE_SHA" ]]; then
            echo 'Source commit did not resolve to the requested SHA' >&2
            exit 1
          fi
          if [[ "$AUTOMATIC" == 'true' ]]; then
            current_sha=$(gh api repos/RLayout/rlayout/commits/main --jq .sha)
            if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
              echo 'Skipping a stale automatic publish request'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.publish == 'true'
        with:
          repository: RLayout/rlayout
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Build browser app
        if: steps.source.outputs.publish == 'true'
        run: bash scripts/build-web.sh

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.source.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.source.outputs.publish == 'true'
        with:
          path: target/web-dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check automatic request is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          AUTOMATIC: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          if [[ "$AUTOMATIC" == 'true' ]]; then
            current_sha=$(gh api repos/RLayout/rlayout/commits/main --jq .sha)
            if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
              echo 'Skipping a source commit superseded during the build'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
